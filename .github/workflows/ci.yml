name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Backend ----------
      - name: Set up Node (api)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend deps
        working-directory: ./apps/api
        run: npm ci

      - name: Build backend
        working-directory: ./apps/api
        run: npm run build

      - name: Run backend tests
        working-directory: ./apps/api
        run: npm test

      # ---------- Frontend ----------
      - name: Set up Node (web)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend deps
        working-directory: ./apps/web
        run: npm ci

      - name: Build frontend
        working-directory: ./apps/web
        run: npm run build

